name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.9; leave empty for an artifact-only build"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One-click release: set the version on main, then let windows-tray build,
  # tag and publish it. An existing tag is published as it is.
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.existing == 'true' && steps.plan.outputs.tag || steps.commit.outputs.sha }}
      create_tag: ${{ steps.plan.outputs.existing != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan release
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3."
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; publishing it without changing main."
            echo "existing=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run a new release from the main branch."
            exit 1
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.existing != 'true'
        with:
          python-version: "3.13"

      - name: Set version and run tests
        if: steps.plan.outputs.existing != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python scripts/set_version.py "$VERSION"
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests

      - name: Commit version to main
        id: commit
        if: steps.plan.outputs.existing != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "Release $VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-tray:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Validate tag version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $pyproject = Get-Content pyproject.toml -Raw
          $pythonMatch = [regex]::Match($pyproject, '(?m)^version[ \t]*=[ \t]*"([^"]+)"[ \t]*\r?$')
          if (-not $pythonMatch.Success) {
            throw "Unable to read the version from pyproject.toml."
          }

          $pythonPackage = Get-Content src/quota_watch/__init__.py -Raw
          $pythonPackageMatch = [regex]::Match($pythonPackage, '(?m)^__version__[ \t]*=[ \t]*"([^"]+)"[ \t]*\r?$')
          if (-not $pythonPackageMatch.Success) {
            throw "Unable to read the version from src/quota_watch/__init__.py."
          }

          [xml]$trayProject = Get-Content windows/QuotaWatch.Tray/QuotaWatch.Tray.csproj
          $trayVersion = [string]$trayProject.Project.PropertyGroup.Version
          if (
            $tagVersion -ne $pythonMatch.Groups[1].Value -or
            $tagVersion -ne $pythonPackageMatch.Groups[1].Value -or
            $tagVersion -ne $trayVersion
          ) {
            throw "Tag $env:RELEASE_TAG does not match package $($pythonMatch.Groups[1].Value), runtime $($pythonPackageMatch.Groups[1].Value), and tray $trayVersion."
          }

      - name: Build tray app
        run: dotnet build windows/QuotaWatch.Tray/QuotaWatch.Tray.csproj --configuration Release

      - name: Run tray smoke tests
        run: dotnet run --project windows/QuotaWatch.Tray.Tests/QuotaWatch.Tray.Tests.csproj --configuration Release

      - name: Publish self-contained executable
        shell: pwsh
        run: ./windows/publish.ps1 -Runtime win-x64

      - name: Package release assets
        id: package
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $versionLabel = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "manual-$env:RUN_NUMBER" }
          $assetBaseName = "quota-watch-tray-$versionLabel-win-x64"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP $assetBaseName
          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null
          Copy-Item windows/artifacts/QuotaWatch.Tray-win-x64/QuotaWatch.Tray.exe $stagingDirectory
          Copy-Item README.md, LICENSE $stagingDirectory

          $archivePath = Join-Path $env:RUNNER_TEMP "$assetBaseName.zip"
          Compress-Archive -Path "$stagingDirectory/*" -DestinationPath $archivePath
          $checksumPath = "$archivePath.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archivePath -Leaf)" | Set-Content -Encoding ascii $checksumPath

          "artifact_name=$assetBaseName" >> $env:GITHUB_OUTPUT
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      # The tag is created only after the build and smoke tests passed.
      - name: Create release tag
        if: needs.prepare.outputs.create_tag == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $env:RELEASE_TAG --message "Quota Watch $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create tag $env:RELEASE_TAG." }
          git push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $env:RELEASE_TAG." }

      - name: Create GitHub release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          $releaseArguments = @(
            'release', 'create', $env:RELEASE_TAG,
            $env:ARCHIVE_PATH, $env:CHECKSUM_PATH,
            '--verify-tag',
            '--title', "Quota Watch $env:RELEASE_TAG",
            '--generate-notes'
          )
          if ($env:RELEASE_TAG.Contains('-')) {
            $releaseArguments += '--prerelease'
          }
          gh @releaseArguments
